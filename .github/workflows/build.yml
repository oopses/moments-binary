name: Build-FreeBSD

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build moments FreeBSD (upstream tag, official style)

    steps:
    - name: Fetch latest upstream tag
      id: upstream
      run: |
        TAG=$(curl -s https://api.github.com/repos/kingwrcy/moments/tags | jq -r '.[0].name')
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "Latest upstream tag: $TAG"

    - name: Clone upstream by tag
      run: |
        git clone -b "${{ steps.upstream.outputs.tag }}" https://github.com/kingwrcy/moments.git upstream

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: stable
        check-latest: true

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        check-latest: false

    - name: Install pnpm
      run: npm install -g pnpm

    # 前端：参考官方，用 generate + 拷贝到 backend/public
    - name: Build frontend (official style)
      run: |
        cd upstream/front
        # 不要用 --frozen-lockfile，避免 pnpm-lock.yaml 缺失导致报错
        pnpm install --no-frozen-lockfile
        pnpm generate
        # 把静态资源拷贝到 backend/public（参考 Makefile）
        rm -rf ../backend/public
        mkdir -p ../backend/public
        cp -r .output/public/* ../backend/public/
        cd ../..

    # 后端：参考 Makefile 的 flags，自行加上 FreeBSD 目标
    - name: Build FreeBSD binary
      run: |
        cd upstream/backend

        VERSION="${{ steps.upstream.outputs.tag }}"
        COMMIT_ID=$(git rev-parse HEAD | cut -c1-7)

        mkdir -p dist

        GOOS=freebsd GOARCH=amd64 CGO_ENABLED=0 \
        go build -tags prod \
          -ldflags="-s -w -X main.version=$VERSION -X main.commitId=$COMMIT_ID" \
          -o dist/moments-freebsd-amd64-$VERSION

        cd dist
        tar -czvf ../moments-freebsd-amd64-$VERSION.tar.gz moments-freebsd-amd64-$VERSION
        cd ..

        cd ../..

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: moments-freebsd
        path: upstream/backend/moments-freebsd-amd64-*.tar.gz

    - name: Create release
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      with:
        tag_name: ${{ steps.upstream.outputs.tag }}
        draft: false
        files: upstream/backend/moments-freebsd-amd64-*.tar.gz
        fail_on_unmatched_files: true

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 1
        keep_minimum_runs: 8
